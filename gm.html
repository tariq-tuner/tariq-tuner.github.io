<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GM | Tariq Tuner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #070b12;
      color: #ffffff;
      line-height: 1.8;
    }

    header {
      background: linear-gradient(135deg, #05080d, #0b1d33);
      padding: 40px 20px;
      text-align: center;
      border-bottom: 2px solid #168cff;
    }

    header img {
      width: 150px;
      max-width: 70%;
      height: auto;
      margin-bottom: 15px;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    header h1 span {
      color: #168cff;
    }

    header p {
      color: #aab4c2;
    }

    nav {
      background: #0b1018;
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #1c2735;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 35px auto;
    }

    .intro {
      background: #0d141e;
      border: 1px solid #1a2635;
      border-radius: 15px;
      padding: 24px;
      margin-bottom: 35px;
    }

    .intro strong {
      color: #168cff;
    }

    .section-title {
      margin: 35px 0 20px;
      font-size: 27px;
      border-right: 5px solid #168cff;
      padding-right: 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: #0d141e;
      border: 1px solid #1a2635;
      border-radius: 16px;
      overflow: hidden;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #168cff;
    }

    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: #05080d;
    }

    .card-content {
      padding: 20px;
    }

    .category {
      display: inline-block;
      color: #168cff;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .card p {
      color: #aeb8c5;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .button {
      display: inline-block;
      padding: 9px 15px;
      background: #168cff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .empty {
      background: #0d141e;
      border: 1px dashed #26374b;
      color: #8995a5;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
    }

    footer {
      margin-top: 60px;
      padding: 30px 20px;
      text-align: center;
      background: #05080d;
      color: #7f8997;
      border-top: 1px solid #182230;
    }

    footer strong {
      color: #168cff;
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <img src="IMG_0035.png" alt="Tariq Tuner">

    <h1><span>GM</span> Guides</h1>

    <p>شروحات وتجارب برمجة وتشخيص سيارات GM</p>
  </header>

  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="#topics">المواضيع</a>
  </nav>

  <div class="container">

    <div class="intro">
      <h2>قسم GM</h2>

      <p>
        هنا أجمع <strong>شروحات وتجارب GM</strong>
        الخاصة بالمحرك والقير والمراوح والتشخيص
        والتعديلات التي تمت تجربتها عمليًا.
      </p>
    </div>

    <h2 class="section-title" id="topics">
      مواضيع GM
    </h2>

    <div class="cards" id="posts">
      <div class="empty">جاري تحميل المواضيع...</div>
    </div>

  </div>

  <footer>
    <strong>Tariq Tuner</strong>
    <br>
    GM Programming • Diagnostics • ECU / TCU
    <br>
    © 2026 جميع الحقوق محفوظة
  </footer>


  <script>
    const categoryNames = {
      engine: "برمجة المحرك",
      transmission: "برمجة القير",
      cooling: "المراوح والحرارة",
      diagnostics: "الأعطال والتشخيص",
      experience: "تجارب وتعديلات",
      tool: "أدوات",
      software: "برامج",
      product: "منتجات"
    };

    function escapeHTML(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadPosts() {
      const container = document.getElementById("posts");

      try {
        const response = await fetch("data/posts.json");

        if (!response.ok) {
          throw new Error("تعذر تحميل ملف المواضيع");
        }

        const posts = await response.json();

        const gmPosts = posts.filter(post =>
          post.brand === "GM" &&
          post.type === "guides"
        );

        if (gmPosts.length === 0) {
          container.innerHTML =
            '<div class="empty">لا توجد مواضيع GM حاليًا.</div>';
          return;
        }

        container.innerHTML = gmPosts.map(post => {

          const image = post.image
            ? `<img src="${escapeHTML(post.image)}" alt="${escapeHTML(post.title)}">`
            : "";

          const category =
            categoryNames[post.category] || post.category || "GM";

          return `
            <article class="card">

              ${image}

              <div class="card-content">

                <span class="category">
                  ${escapeHTML(category)}
                </span>

                <h3>
                  ${escapeHTML(post.title)}
                </h3>

                <p>
                  ${escapeHTML(post.summary)}
                </p>

                <a class="button"
                   href="post.html?id=${encodeURIComponent(post.id)}">
                  اقرأ الموضوع
                </a>

              </div>

            </article>
          `;

        }).join("");

      } catch (error) {

        container.innerHTML =
          '<div class="empty">حدث خطأ أثناء تحميل المواضيع.</div>';

        console.error(error);
      }
    }

    loadPosts();
  </script>

</body>

</html>
